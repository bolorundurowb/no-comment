<!DOCTYPE html>
<html lang="en-NG">
<head>
  <meta charset="UTF-8">
  <title></title>

  <link rel="stylesheet" href="popup.css">
</head>
<body>
<div class="header" id="popup-heading"></div>

<div class="option-row">
  <span id="label-enable-extension"></span>

  <label class="switch">
    <input type="checkbox" id="all-sites" checked>
    <span class="slider"></span>
  </label>
</div>

<div>
  <div class="option-row">
    <img src="../icons/youtube.svg" id="icon-youtube" alt=""/>
    <span id="label-youtube"></span>

    <label class="switch">
      <input type="checkbox" id="youtube" disabled>
      <span class="slider"></span>
    </label>
  </div>

  <div class="option-row">
    <img src="../icons/facebook.svg" id="icon-facebook" alt=""/>
    <span id="label-facebook"></span>

    <label class="switch">
      <input type="checkbox" id="facebook" disabled>
      <span class="slider"></span>
    </label>
  </div>

  <div class="option-row">
    <img src="../icons/reddit.svg" id="icon-reddit" alt=""/>
    <span id="label-reddit"></span>

    <label class="switch">
      <input type="checkbox" id="reddit" disabled>
      <span class="slider"></span>
    </label>
  </div>
</div>

<script src="./popup.js"></script>
</body>
</html>
